<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Training Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Circuit Training Generator</h1>

    <form id="workout-form">
      <fieldset>
        <legend>Select workout type</legend>

        <label>
          <input type="radio" name="workout-type" value="full-body" required>
          Full Body
        </label>

        <label>
          <input type="radio" name="workout-type" value="upper-body" required>
          Upper Body
        </label>

        <label>
          <input type="radio" name="workout-type" value="lower-body" required>
          Lower Body
        </label>
      </fieldset>

      <div class="form-field">
        <label>Select exercise duration</label>
        <div class="duration-fields">
          <div class="duration-field">
            <label for="exercise-minutes">Minutes</label>
            <input
              type="number"
              id="exercise-minutes"
              name="exercise-minutes"
              min="0"
              max="8"
              step="1"
              required
            >
          </div>
          <div class="duration-field">
            <label for="exercise-seconds">Seconds</label>
            <input
              type="number"
              id="exercise-seconds"
              name="exercise-seconds"
              min="0"
              max="59"
              step="1"
              required
            >
          </div>
        </div>
        <small>Choose a total duration from 1 to 500 seconds.</small>
      </div>

      <div class="form-field">
        <label>Rest time between exercises</label>
        <div class="duration-fields">
          <div class="duration-field">
            <label for="rest-minutes">Minutes</label>
            <input
              type="number"
              id="rest-minutes"
              name="rest-minutes"
              min="0"
              max="5"
              step="1"
              required
            >
          </div>
          <div class="duration-field">
            <label for="rest-seconds">Seconds</label>
            <input
              type="number"
              id="rest-seconds"
              name="rest-seconds"
              min="0"
              max="59"
              step="1"
              required
            >
          </div>
        </div>
        <small>Choose a total rest time from 0 to 300 seconds.</small>
      </div>

      <button type="submit">Generate Workout</button>
    </form>

    <section id="workout-view" hidden aria-live="polite">
      <h2>Your Workout</h2>
      <ol id="exercise-list"></ol>
      <button type="button" id="generate-again-button">Generate Again</button>
      <button type="button" id="back-button">Back to Circuit Training Generator</button>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Training Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Circuit Training Generator</h1>

    <form id="workout-form">
      <fieldset>
        <legend>Select workout type</legend>

        <label>
          <input type="radio" name="workout-type" value="full-body" required>
          Full Body
        </label>

        <label>
          <input type="radio" name="workout-type" value="upper-body" required>
          Upper Body
        </label>

        <label>
          <input type="radio" name="workout-type" value="lower-body" required>
          Lower Body
        </label>
      </fieldset>

      <div class="form-field">
        <label for="exercise-duration">Select exercise duration</label>
        <input
          type="number"
          id="exercise-duration"
          name="exercise-duration"
          min="1"
          max="500"
          step="1"
          required
        >
        <small>Enter a whole number from 1 to 500 seconds.</small>
      </div>
    </form>
  </main>
</body>
</html>
